<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva prestación</title>
</head>

<body>
{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

    <h1>Registrar prestación</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>

    </form>

    <br>

    <a href="{% url 'prestaciones' %}">
        Volver
    </a>

</body>
</html>
