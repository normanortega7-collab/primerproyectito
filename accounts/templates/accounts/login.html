<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h1>Iniciar sesión</h1>

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>Usuario</label>
            <input type="text" name="username">
        </div>

        <div>
            <label>Contraseña</label>
            <input type="password" name="password">
        </div>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

</body>
</html>
